x-logging: &logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:
  forwarder:
    build: .
    image: forwarder:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      HEARTBEAT_PATH: ${HEARTBEAT_PATH:-/health}
      FORWARD_TARGET_HEADER: ${FORWARD_TARGET_HEADER:-x-forward-url}
      TRUSTED_IPS: ${TRUSTED_IPS:-127.0.0.1}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-30000}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${PORT:-3000}${HEARTBEAT_PATH:-/health} || exit 1",
        ]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}
    labels:
      autoheal: "true"
    logging: *logging

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *logging
